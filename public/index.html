<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
  </head>
  <body>
    <input id="temp" type="number" placeholder="Temperatura" />
    <input id ="login" type="text" placeholder="Login" />
    <input id = "email" type="email" placeholder="email" />
    <input id = "password" type="password" placeholder="hasło"/>


    <button onclick="wyslij()">Wyślij</button>

    <script>
      async function wyslij() {
        const temperatura = parseFloat(document.getElementById("temp").value);

        console.log("temperatura:", temperatura);
        console.log("typ:", typeof temperatura);

        const response = await fetch("/app/dodaj", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            temperatura: temperatura,
          }),
        });

        const dane = await response.json();

        console.log(dane);
      }
    </script>
  </body>
</html>
